name: .NET Build & Publish

on:
  push:
    branches: [ "main", "preview" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "preview" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test Telegram.BotKit.Tests/Telegram.BotKit.Tests.csproj --no-build --configuration Release --verbosity normal

    # Публикуем только теги v* и пуши в ветку preview
    - name: Decide publish
      id: decide
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]] || [ "${GITHUB_REF_NAME}" = "preview" ]; then
          echo "publish=true" >> $GITHUB_OUTPUT
        else
          echo "publish=false" >> $GITHUB_OUTPUT
        fi

    - name: Pack
      if: steps.decide.outputs.publish == 'true'
      run: |
        dotnet pack Telegram.BotKit/Telegram.BotKit.csproj \
          --no-build \
          --configuration Release \
          --output ./nupkgs

    - name: Publish to GitHub Packages
      if: steps.decide.outputs.publish == 'true'
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate

    - name: Publish to NuGet.org
      if: steps.decide.outputs.publish == 'true'
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate