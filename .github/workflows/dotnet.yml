name: .NET Build & Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Decide publish
      id: decide
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a version tag like v2.0.0"
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main, nothing will be published"
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      env:
        VERSION: ${{ steps.decide.outputs.version }}
      run: dotnet build --no-restore --configuration Release ${VERSION:+-p:Version=$VERSION}

    - name: Test
      run: dotnet test Telegram.BotKit.Tests/Telegram.BotKit.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Pack
      if: steps.decide.outputs.publish == 'true'
      env:
        VERSION: ${{ steps.decide.outputs.version }}
      run: |
        dotnet pack Telegram.BotKit/Telegram.BotKit.csproj \
          --no-build \
          --configuration Release \
          -p:Version="$VERSION" \
          --output ./nupkgs

    - name: Publish to GitHub Packages
      if: steps.decide.outputs.publish == 'true'
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --api-key "$GITHUB_PACKAGES_TOKEN" \
          --skip-duplicate

    - name: Publish to NuGet.org
      if: steps.decide.outputs.publish == 'true'
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key "$NUGET_API_KEY" \
          --skip-duplicate